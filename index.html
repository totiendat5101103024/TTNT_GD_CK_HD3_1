<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vườn Thú Thần Kỳ</title>
    <!-- Thư viện TensorFlow.js & Teachable Machine Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-shadow: #e65555;
            --secondary: #ffe66d;
            --secondary-shadow: #f1c40f;
            --accent: #4ecdc4;
            --accent-shadow: #3db3a9;
            --bg-color: #fff9e6;
        }

        body {
            /* Nền phong cách mẫu giáo (Kindergarten Pattern) */
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(255, 107, 107, 0.1) 15%, transparent 15%), 
                              radial-gradient(rgba(255, 107, 107, 0.1) 15%, transparent 15%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 6px solid var(--primary);
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header h1 {
            text-align: center;
            color: var(--primary);
            margin: 0;
            font-size: 2.8rem;
            text-shadow: 3px 3px 0px var(--secondary);
            letter-spacing: 2px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .video-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #webcam-container {
            width: 100%;
            aspect-ratio: 4/3;
            background: #e8f8f5;
            border: 8px solid var(--accent);
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        #webcam-container canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #webcam-placeholder {
            color: var(--accent-shadow);
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        .result-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8f9fa;
            border: 6px dashed var(--accent);
            border-radius: 25px;
            padding: 20px;
            position: relative;
        }

        .result-section h2 {
            color: var(--accent);
            margin-top: 0;
            font-size: 2rem;
            text-align: center;
        }

        #animal-display {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        #normal-text {
            font-size: 1.5rem;
            color: #a4b0be;
            font-style: italic;
            text-align: center;
            animation: pulse 2s infinite;
        }

        #animal-image {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: none;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        @keyframes bounceIn {
            0% { transform: scale(0) rotate(-10deg); }
            80% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            filter: grayscale(0.5);
        }

        .btn.primary {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 6px 0px var(--accent-shadow);
        }
        .btn.primary:active { box-shadow: 0 0px 0px var(--accent-shadow); }

        .btn.secondary {
            background-color: var(--secondary);
            color: #d35400;
            box-shadow: 0 6px 0px var(--secondary-shadow);
        }
        .btn.secondary:active { box-shadow: 0 0px 0px var(--secondary-shadow); }

        .btn.danger {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 6px 0px var(--primary-shadow);
        }
        .btn.danger:active { box-shadow: 0 0px 0px var(--primary-shadow); }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🌟 Vườn Thú Thần Kỳ 🌟</h1>
        </header>

        <main>
            <!-- Khu vực Camera (Giống Teachable Machine) -->
            <div class="video-section">
                <div id="webcam-container">
                    <div id="webcam-placeholder">Nhấn "Bật Camera" để bắt đầu nhé! 👇</div>
                </div>
                <div class="controls">
                    <button id="toggle-camera-btn" class="btn primary">📷 Bật Camera</button>
                    <button id="toggle-predict-btn" class="btn secondary" disabled>✨ Bắt đầu Dự đoán</button>
                </div>
            </div>

            <!-- Khu vực Kết quả Dự đoán -->
            <div class="result-section">
                <h2>Đó là con gì nhỉ? 🤔</h2>
                <div id="animal-display">
                    <div id="normal-text">Hãy làm một tư thế nào! 💃🕺</div>
                    <img id="animal-image" src="" alt="Con vật">
                </div>
            </div>
        </main>
    </div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/TD1zvKLI0/";
        let model, webcam, maxPredictions;
        let currentAnimal = "Normal";
        const threshold = 0.85;
        
        // Cờ trạng thái
        let isCameraOn = false;
        let isPredicting = false;

        // Quản lý Audio Context cho trình duyệt
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Quản lý âm thanh
        const audios = {
            Dog: new Audio('./audio/Dog.mp3'),
            Cat: new Audio('./audio/Cat.mp3'),
            Chicken: new Audio('./audio/Chicken.mp3'),
            Duck: new Audio('./audio/Duck.mp3'),
        };

        const animalImg = document.getElementById('animal-image');
        const normalText = document.getElementById('normal-text');
        const camBtn = document.getElementById('toggle-camera-btn');
        const predictBtn = document.getElementById('toggle-predict-btn');

        // Bắt sự kiện Bật/Tắt Camera
        camBtn.addEventListener('click', async () => {
            // Mở khoá audio context
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            // Tải trước âm thanh
            for(let key in audios) audios[key].load();

            if (!isCameraOn) {
                await startCamera();
            } else {
                stopCamera();
            }
        });

        // Bắt sự kiện Bật/Tắt Dự đoán
        predictBtn.addEventListener('click', () => {
            if (!isPredicting) {
                startPredicting();
            } else {
                stopPredicting();
            }
        });

        async function startCamera() {
            camBtn.innerText = "⏳ Đang tải...";
            camBtn.disabled = true;

            try {
                // Chỉ tải model 1 lần
                if (!model) {
                    model = await tmPose.load(URL + "model.json", URL + "metadata.json");
                    maxPredictions = model.getTotalClasses();
                }

                // Cấu hình webcam: Lật hình ảnh giống gương
                webcam = new tmPose.Webcam(640, 480, true); 
                await webcam.setup(); 
                await webcam.play();
                
                // Hiển thị canvas
                const container = document.getElementById("webcam-container");
                container.innerHTML = ''; 
                container.appendChild(webcam.canvas);

                isCameraOn = true;
                
                // Cập nhật giao diện nút
                camBtn.innerText = "🛑 Tắt Camera";
                camBtn.classList.replace('primary', 'danger');
                camBtn.disabled = false;
                predictBtn.disabled = false;

                // Bắt đầu vòng lặp webcam
                window.requestAnimationFrame(loop);
            } catch (e) {
                console.error(e);
                camBtn.innerText = "❌ Lỗi Camera!";
                setTimeout(() => {
                    camBtn.innerText = "📷 Bật Camera";
                    camBtn.disabled = false;
                }, 2000);
            }
        }

        function stopCamera() {
            if (webcam) {
                webcam.stop();
                document.getElementById("webcam-container").innerHTML = '<div id="webcam-placeholder">😴 Đã tắt Camera</div>';
            }
            isCameraOn = false;
            
            // Đặt lại giao diện nút
            camBtn.innerText = "📷 Bật Camera";
            camBtn.classList.replace('danger', 'primary');
            
            // Dừng dự đoán nếu đang chạy
            stopPredicting();
            predictBtn.disabled = true;
        }

        function startPredicting() {
            isPredicting = true;
            predictBtn.innerText = "⏸ Dừng Dự đoán";
            predictBtn.classList.replace('secondary', 'danger');
            
            // Cập nhật text khởi đầu
            if (currentAnimal === "Normal") {
                normalText.innerText = "Đang xem bạn tạo dáng gì nè... 👀";
            }
        }

        function stopPredicting() {
            isPredicting = false;
            predictBtn.innerText = "✨ Bắt đầu Dự đoán";
            predictBtn.classList.replace('danger', 'secondary');
            
            // Reset về trạng thái bình thường
            handleStateChange("Normal");
            normalText.innerText = "Hãy làm một tư thế nào! 💃🕺";
        }

        async function loop(timestamp) {
            if (isCameraOn) {
                webcam.update(); // Luôn cập nhật hình ảnh webcam
                if (isPredicting) {
                    await predict(); // Chỉ dự đoán khi bật cờ
                }
                window.requestAnimationFrame(loop);
            }
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let maxProb = 0;
            let predictedClass = "Normal";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maxProb) {
                    maxProb = prediction[i].probability;
                    predictedClass = prediction[i].className;
                }
            }

            if (maxProb > threshold && currentAnimal !== predictedClass) {
                currentAnimal = predictedClass;
                handleStateChange(predictedClass);
            }
        }

        function handleStateChange(animal) {
            if (animal === "Normal") {
                animalImg.style.display = 'none';
                normalText.style.display = 'block';
                normalText.innerText = "Đang xem bạn tạo dáng gì nè... 👀";
                stopAllAudio();
            } else {
                stopAllAudio();
                normalText.style.display = 'none';
                
                // Cập nhật nguồn hình ảnh theo đúng yêu cầu
                animalImg.src = `./images/${animal}.png`;
                animalImg.style.display = 'block';
                
                // Khởi động lại CSS animation bật nảy
                animalImg.style.animation = 'none';
                void animalImg.offsetWidth;
                animalImg.style.animation = 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                // Phát âm thanh
                if (audios[animal]) {
                    audios[animal].currentTime = 0;
                    audios[animal].play().catch(e => console.log("Lỗi phát âm thanh:", e)); 
                }
            }
        }

        function stopAllAudio() {
            for (let key in audios) {
                audios[key].pause();
                audios[key].currentTime = 0;
            }
        }
    </script>
</body>
</html>
